<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay · Team planner</title>
<link rel="stylesheet" href="../common/style.css">
</head>
<body>
<header class="top"><div class="bar"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand">Relay</span><span class="divider"></span><span class="workspace" id="workspace">Team planning workspace</span>
<label class="role" id="roleBox"><span>Demo view</span><select id="role" aria-label="Demo view"><option value="member">Team member</option><option value="team">Team manager</option><option value="pm">Project manager</option></select></label><select id="memberPreview" aria-label="Preview as team member"></select>
<span class="identity" id="identity" hidden></span><button class="tool" id="refresh" hidden>↻ Refresh from Jira</button><button class="tool" id="settingsLink" type="button" hidden>Settings</button></div></header>
<nav class="tabs" aria-label="Planner pages"><div class="bar"><button class="tab" id="homeTab">Overview</button><button class="tab" id="queueTab">Work queue</button><button class="tab" id="scheduleTab">Calendar</button><button class="tab" id="coverageTab">Coverage</button><button class="tab" id="outlookTab">Project outlook</button><button class="tab" id="sheetTab">Timesheet</button><button class="tab" id="reportTab">Reports</button><button class="tab" id="rulesTab">Planning rules</button></div></nav>
<main><section class="hero"><div><h1 id="title">Team schedule</h1><p id="intro"></p></div><button class="primary" id="simulate">＋ Test a change</button></section><div id="notice" class="message" role="status"></div><div id="view"><p class="empty">Loading the plan…</p></div><footer class="below"><span id="footnote"></span><button class="link" id="reset">Reset demo</button></footer></main>
<dialog id="modal" aria-labelledby="dialogTitle"><div class="modalhead"><h2 id="dialogTitle"></h2><button class="close" id="close" aria-label="Close dialog">×</button></div><div id="body" class="content"></div></dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
