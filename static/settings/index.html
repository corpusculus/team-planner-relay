<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay settings</title>
<link rel="stylesheet" href="../common/style.css">
<style>
.settings main{padding-top:24px}
.savebar{position:sticky;top:0;z-index:5;background:var(--wash);display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:18px}
.savebar .grow{flex:1}
.panel .content h3{margin:18px 0 8px}
.data td{vertical-align:middle;padding:8px 10px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:450}
.checks label{display:flex;gap:4px;align-items:center;white-space:nowrap}
.archived{opacity:.5}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px;background:#fff}
.card-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.card-head input{font-weight:650;flex:1}
.card-head label{white-space:nowrap;font-size:13px;display:flex;gap:6px;align-items:center}
.field-label{font-size:13px;font-weight:620}
input:disabled{background:var(--wash);color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.result{font-size:15px;padding:12px;border-radius:8px;background:#edf3ed;margin-top:12px}
.modebox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.link-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.link-row input,.link-row select{flex:1 1 140px;width:auto}
.linked{color:var(--teal);font-weight:620}
.section-tabs{display:flex;gap:24px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px}
.section-tabs .tab{height:42px;white-space:nowrap}
.panel .content>button[data-add],.panel .content>.queue-tools{margin-bottom:14px}
.field>.holiday-editor{margin-top:6px;display:grid;gap:8px}
.holiday-editor .link-row{margin-top:0}
.card-row{display:flex;align-items:center;gap:12px}
.card-sum{flex:1;min-width:0;display:grid;gap:2px}
.card-sum b,.card-sum .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
.step{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step-mark{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:2px solid #c7d1cb;display:grid;place-items:center;font-weight:700;color:#fff}
.step.complete .step-mark{background:var(--teal);border-color:var(--teal)}
.step>button{width:150px}
.step-text{flex:1;min-width:0;display:grid;gap:2px}
.step-text .hint{margin:0}
@media(max-width:700px){.step{flex-wrap:wrap}.step>button{margin-left:40px}}
.badge{font:11px var(--mono);padding:3px 7px;border-radius:5px;background:#193a36;color:#c2e9bb}
</style>
</head>
<body class="settings">
<header class="top"><div class="bar"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand">Team Planner Relay</span><span class="divider"></span><span class="workspace">Settings</span><select id="teamPick" aria-label="Team" hidden></select><button id="plannerLink" type="button" hidden>← Planner</button></div></header>
<main>
<div class="savebar"><span class="grow" id="status" role="status"></span><button id="discard" disabled>Discard changes</button><button class="primary" id="save" disabled>Save settings</button></div>
<div id="view"><p class="empty">Loading settings…</p></div>
</main>
<dialog id="modal" aria-labelledby="dialogTitle"><div class="modalhead"><h2 id="dialogTitle"></h2><button class="close" id="close" aria-label="Close dialog">×</button></div><div id="body" class="content"></div></dialog>
<script type="module" src="./main.js"></script>
</body>
</html>
