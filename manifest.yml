modules:
  jira:globalPage:
    - key: relay-planner
      title: Team Planner Relay
      resource: planner
      resolver:
        function: resolver
  jira:adminPage:
    - key: relay-settings
      title: Team Planner Relay settings
      resource: settings
      resolver:
        function: resolver
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: planner
    path: dist/planner
  - key: settings
    path: dist/settings
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
  content:
    styles:
      - unsafe-inline
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d480a29e-d346-449b-b4d8-8019c22c5279
