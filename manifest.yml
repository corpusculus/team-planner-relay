modules:
  jira:globalPage:
    - key: relay-planner
      title: Team Planner Relay
      icon: resource:icons;relay.svg
      layout: blank
      resource: planner
      resolver:
        function: resolver
  jira:adminPage:
    - key: relay-settings
      title: Team Planner Relay settings
      resource: settings
      resolver:
        function: resolver
  jira:issueContext:
    - key: relay-issue-plan
      title: Team plan
      label: Team plan
      resource: issue
      resolver:
        function: resolver
  scheduledTrigger:
    - key: relay-auto-refresh
      function: auto-refresh
      interval: fiveMinute
  function:
    - key: resolver
      handler: index.handler
    - key: auto-refresh
      handler: index.autoRefresh
resources:
  - key: planner
    path: dist/planner
  - key: settings
    path: dist/settings
  - key: issue
    path: dist/issue
  - key: icons
    path: static/icons
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - storage:app
  content:
    styles:
      - unsafe-inline
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/d480a29e-d346-449b-b4d8-8019c22c5279
